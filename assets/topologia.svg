<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="t-title t-desc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t-title">Simplified topology of the infrastructure run by Luis Antonio Rosas</title>
  <desc id="t-desc">The Internet comes in through HAProxy load balancers to Node and PHP applications, Moodle and Canvas campuses, Koha and DSpace; all backed by MySQL, MariaDB, PostgreSQL and Redis, with nightly backups, a NAS, an XCP-ng pool and an encrypted management network.</desc>
  <defs>
    <linearGradient id="g-acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="g-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .box{fill:#111a2e;stroke:#2a3650;stroke-width:1.2;rx:14}
      .box.hot{stroke:url(#g-acc);stroke-width:1.6}
      .t{fill:#e6e9f2;font-size:15px;font-weight:700}
      .s{fill:#9aa4bd;font-size:12.5px}
      .m{fill:#22d3ee;font-size:11.5px;font-weight:700;letter-spacing:.08em}
      .k{fill:#a78bfa;font-size:11.5px;font-weight:700;letter-spacing:.08em}
      .l{fill:none;stroke:#3b4a6b;stroke-width:1.6}
      .f{fill:none;stroke:url(#g-acc);stroke-width:1.6;stroke-dasharray:6 10;stroke-linecap:round;animation:flow 2.4s linear infinite}
      .mesh{fill:none;stroke:#34d399;stroke-width:1.2;stroke-dasharray:3 7;opacity:.8}
      @keyframes flow{to{stroke-dashoffset:-32}}
      @media (prefers-reduced-motion: reduce){.f{animation:none}}
    </style>
  </defs>

  <rect width="1000" height="620" rx="20" fill="url(#g-bg)"/>
  <rect width="1000" height="620" rx="20" fill="url(#grid)"/>

  <!-- Internet -->
  <g>
    <rect class="box hot" x="400" y="22" width="200" height="46" rx="23"/>
    <text class="t" x="500" y="51" text-anchor="middle">Internet · users</text>
  </g>

  <path class="l" d="M500 68 V96 H260 V120"/>
  <path class="l" d="M500 68 V96 H740 V120"/>
  <path class="f" d="M500 68 V96 H260 V120"/>
  <path class="f" d="M500 68 V96 H740 V120"/>

  <!-- Balanceadores -->
  <g>
    <rect class="box hot" x="140" y="120" width="240" height="64"/>
    <text class="m" x="160" y="142">LOAD BALANCER · SITE 1</text>
    <text class="t" x="160" y="163">HAProxy · TLS</text>
    <text class="s" x="160" y="178">per-application routing</text>
  </g>
  <g>
    <rect class="box hot" x="620" y="120" width="240" height="64"/>
    <text class="m" x="640" y="142">LOAD BALANCER · SITE 2</text>
    <text class="t" x="640" y="163">HAProxy · TLS</text>
    <text class="s" x="640" y="178">campus · library · DTE</text>
  </g>

  <path class="l" d="M260 184 V212 H140 V236"/>
  <path class="l" d="M260 184 V212 H420 V236"/>
  <path class="l" d="M740 184 V212 H580 V236"/>
  <path class="l" d="M740 184 V212 H860 V236"/>
  <path class="f" d="M260 184 V212 H140 V236"/>
  <path class="f" d="M740 184 V212 H860 V236"/>

  <!-- Apps -->
  <g>
    <rect class="box" x="40" y="236" width="270" height="110"/>
    <text class="m" x="60" y="260">APPLICATIONS · NODE / PHP</text>
    <text class="t" x="60" y="283">SIGU · NEXUS v2</text>
    <text class="s" x="60" y="302">Clinical placements · Assessment · English</text>
    <text class="s" x="60" y="319">Suite DTE · WordPress · Odoo</text>
    <text class="s" x="60" y="336">PM2 + Apache · 2,000+ users</text>
  </g>
  <!-- LMS -->
  <g>
    <rect class="box" x="330" y="236" width="300" height="110"/>
    <text class="m" x="350" y="260">LMS · VIRTUAL CLASSROOMS</text>
    <text class="t" x="350" y="283">Moodle · Canvas</text>
    <text class="s" x="350" y="302">Several Moodle campuses</text>
    <text class="s" x="350" y="319">Canvas in Docker containers</text>
    <text class="s" x="350" y="336">Tuned PHP-FPM · files on NFS</text>
  </g>
  <!-- Biblioteca -->
  <g>
    <rect class="box" x="650" y="236" width="310" height="110"/>
    <text class="m" x="670" y="260">LIBRARY · REPOSITORY</text>
    <text class="t" x="670" y="283">Koha ILS · DSpace</text>
    <text class="s" x="670" y="302">MARC21 catalog · OPAC · loans</text>
    <text class="s" x="670" y="319">Tomcat + Solr · PostgreSQL</text>
    <text class="s" x="670" y="336">Odoo intranet</text>
  </g>

  <path class="l" d="M175 346 V392"/>
  <path class="l" d="M480 346 V392"/>
  <path class="l" d="M805 346 V392"/>
  <path class="f" d="M480 346 V392"/>

  <!-- Datos -->
  <g>
    <rect class="box hot" x="40" y="392" width="920" height="70"/>
    <text class="m" x="60" y="416">DATA LAYER · DEDICATED SERVERS</text>
    <text class="t" x="60" y="440">MySQL · MariaDB · PostgreSQL · Redis</text>
    <text class="s" x="60" y="455">One dedicated database per system · major upgrades with reports</text>
  </g>

  <path class="l" d="M300 462 V500"/>
  <path class="l" d="M700 462 V500"/>
  <path class="f" d="M300 462 V500"/>

  <!-- Respaldos -->
  <g>
    <rect class="box" x="40" y="500" width="520" height="80"/>
    <text class="k" x="60" y="524">BACKUPS · SAVITAR → DEDICATED SERVER</text>
    <text class="t" x="60" y="547">Databases nightly · code weekly</text>
    <text class="s" x="60" y="566">Every dump is opened and verified · automatic rotation · disk alerts</text>
  </g>
  <!-- NAS -->
  <g>
    <rect class="box" x="580" y="500" width="380" height="80"/>
    <text class="k" x="600" y="524">STORAGE</text>
    <text class="t" x="600" y="547">NAS Synology</text>
    <text class="s" x="600" y="566">NFS / SMB · platform files</text>
  </g>

  <!-- Overlays -->
  <g>
    <rect x="22" y="22" width="300" height="64" rx="14" fill="#0f1a2e" stroke="#34d399" stroke-opacity=".5"/>
    <text class="s" x="40" y="45" fill="#34d399" font-weight="700" letter-spacing=".08em" font-size="11.5">ENCRYPTED MANAGEMENT NETWORK</text>
    <text class="s" x="40" y="66">VPN · hardened SSH · 27 servers</text>
    <path class="mesh" d="M322 54 H390"/>
  </g>
  <g>
    <rect x="678" y="22" width="300" height="64" rx="14" fill="#0f1a2e" stroke="#fbbf24" stroke-opacity=".5"/>
    <text class="s" x="696" y="45" fill="#fbbf24" font-weight="700" letter-spacing=".08em" font-size="11.5">VIRTUALIZATION · XCP-NG</text>
    <text class="s" x="696" y="66">18 VMs · hardware health monitored</text>
    <path class="mesh" d="M610 54 H678" stroke="#fbbf24"/>
  </g>

  <!-- Savitar -->
  <g filter="url(#glow)">
    <rect x="370" y="586" width="260" height="26" rx="13" fill="#141b33" stroke="url(#g-acc)"/>
    <text x="500" y="604" text-anchor="middle" fill="#e6e9f2" font-size="12" font-weight="700">SAVITAR · monitoring · backups · alerts</text>
  </g>
</svg>
