      <text x="95" y="104" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">sistemas</text>
      <text x="95" y="124" text-anchor="middle" fill="#5b6478" font-size="12" font-weight="500">TypeScript · PHP · Python</text>
    </g>
