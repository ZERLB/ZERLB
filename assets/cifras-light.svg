      <text x="95" y="74" text-anchor="middle" fill="url(#acc)" font-size="46">8</text>
      <text x="95" y="104" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">bases / noche</text>
      <text x="95" y="124" text-anchor="middle" fill="#5b6478" font-size="12" font-weight="500">respaldos verificados</text>
    </g>
