<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Luis Antonio Rosas Gómez · Ingeniero en Sistemas · Full Stack e Infraestructura" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1326"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#22d3ee;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="980" cy="60" r="260" fill="url(#glow1)">
      <animate attributeName="cx" values="980;900;980" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="300" r="240" fill="url(#glow2)">
      <animate attributeName="cy" values="300;220;300" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="320" r="200" fill="url(#glow2)" opacity=".6"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- texto -->
  <text x="64" y="92" fill="#8b93a7" font-size="15" letter-spacing=".22em" font-weight="700">ZERLB · CIUDAD DE MÉXICO</text>
  <text x="64" y="158" fill="#f3f4f8" font-size="58" font-weight="800" letter-spacing="-.02em">Luis Antonio Rosas Gómez</text>
  <text x="64" y="204" fill="url(#acc)" font-size="26" font-weight="700">Ingeniero en Sistemas · Full Stack · Infraestructura</text>
  <text x="64" y="244" fill="#aab2c5" font-size="17">Construyo sistemas web completos y opero la infraestructura donde corren.</text>

  <!-- consola -->
  <g transform="translate(64 268)">
    <rect x="0" y="0" width="610" height="34" rx="10" fill="#0a0f1d" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="16" y="23" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">$</text>
    <text x="32" y="23" fill="#e6e9f2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">whoami → dev + sysadmin · XCP-ng · HAProxy · Node/TS · MySQL/PG</text>
    <rect x="584" y="10" width="8" height="16" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- chips derecha -->
  <g font-size="13" font-weight="700" letter-spacing=".06em">
    <rect x="800" y="236" width="150" height="34" rx="17" fill="#111a2e" stroke="#22d3ee" stroke-opacity=".5"/>
    <text x="875" y="258" text-anchor="middle" fill="#22d3ee">27 SERVIDORES</text>
    <rect x="962" y="236" width="174" height="34" rx="17" fill="#111a2e" stroke="#a78bfa" stroke-opacity=".5"/>
    <text x="1049" y="258" text-anchor="middle" fill="#a78bfa">2 000+ USUARIOS</text>
    <rect x="800" y="280" width="336" height="34" rx="17" fill="#111a2e" stroke="#fbbf24" stroke-opacity=".5"/>
    <text x="968" y="302" text-anchor="middle" fill="#fbbf24">20+ SISTEMAS EN PRODUCCIÓN</text>
  </g>

  <!-- línea animada -->
  <path d="M64 318 H1136" stroke="url(#acc)" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>
