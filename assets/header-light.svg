<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Luis Antonio Rosas Gómez · Systems Engineer · Full Stack · Infrastructure" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fc"/>
      <stop offset="1" stop-color="#eef1f9"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2">
        <animate attributeName="stop-color" values="#0891b2;#7c3aed;#0891b2" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#0891b2;#7c3aed" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".30"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#0f172a" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="980" cy="60" r="260" fill="url(#glow1)">
      <animate attributeName="cx" values="980;900;980" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="300" r="240" fill="url(#glow2)">
      <animate attributeName="cy" values="300;220;300" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="320" r="200" fill="url(#glow2)" opacity=".6"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="none" stroke="#0f172a" stroke-opacity=".10"/>

  <text x="64" y="92" fill="#5b6478" font-size="15" letter-spacing=".22em" font-weight="700">ZERLB · MEXICO CITY</text>
  <text x="64" y="158" fill="#0f172a" font-size="58" font-weight="800" letter-spacing="-.02em">Luis Antonio Rosas Gómez</text>
  <text x="64" y="204" fill="url(#acc)" font-size="26" font-weight="700">Systems Engineer · Full Stack · Infrastructure</text>
  <text x="64" y="244" fill="#3f4a62" font-size="17">I build complete web systems and run the infrastructure they live on.</text>

  <g transform="translate(64 268)">
    <rect x="0" y="0" width="610" height="34" rx="10" fill="#0f172a"/>
    <text x="16" y="23" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">$</text>
    <text x="32" y="23" fill="#e6e9f2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">whoami → dev + sysadmin · XCP-ng · HAProxy · Node/TS · MySQL/PG</text>
    <rect x="584" y="10" width="8" height="16" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-size="13" font-weight="700" letter-spacing=".06em">
    <rect x="800" y="236" width="150" height="34" rx="17" fill="#ffffff" stroke="#0891b2" stroke-opacity=".6"/>
    <text x="875" y="258" text-anchor="middle" fill="#0891b2">27 SERVERS</text>
    <rect x="962" y="236" width="174" height="34" rx="17" fill="#ffffff" stroke="#7c3aed" stroke-opacity=".6"/>
    <text x="1049" y="258" text-anchor="middle" fill="#7c3aed">2,000+ USERS</text>
    <rect x="800" y="280" width="336" height="34" rx="17" fill="#ffffff" stroke="#d97706" stroke-opacity=".6"/>
    <text x="968" y="302" text-anchor="middle" fill="#b45309">20+ SYSTEMS IN PRODUCTION</text>
  </g>

  <path d="M64 318 H1136" stroke="url(#acc)" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>
