<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Figures: 27 servers, 18 virtual machines, 20+ systems, 2,000+ daily users, 24/7 monitoring, 4 CCNA modules" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <g font-weight="800">
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="190" height="150" rx="18" fill="#0f1526" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="95" y="74" text-anchor="middle" fill="url(#acc)" font-size="46">27</text>
      <text x="95" y="104" text-anchor="middle" fill="#e6e9f2" font-size="14" font-weight="700">servers</text>
      <text x="95" y="124" text-anchor="middle" fill="#8b93a7" font-size="12" font-weight="500">Linux · XCP-ng · NAS</text>
    </g>
    <g transform="translate(202 0)">
      <rect x="0" y="0" width="190" height="150" rx="18" fill="#0f1526" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="95" y="74" text-anchor="middle" fill="url(#acc)" font-size="46">18</text>
      <text x="95" y="104" text-anchor="middle" fill="#e6e9f2" font-size="14" font-weight="700">VMs on XCP-ng</text>
      <text x="95" y="124" text-anchor="middle" fill="#8b93a7" font-size="12" font-weight="500">virtualization pool</text>
    </g>
    <g transform="translate(404 0)">
      <rect x="0" y="0" width="190" height="150" rx="18" fill="#0f1526" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="95" y="74" text-anchor="middle" fill="url(#acc)" font-size="46">20+</text>
      <text x="95" y="104" text-anchor="middle" fill="#e6e9f2" font-size="14" font-weight="700">systems</text>
      <text x="95" y="124" text-anchor="middle" fill="#8b93a7" font-size="12" font-weight="500">TypeScript · PHP · Python</text>
    </g>
    <g transform="translate(606 0)">
      <rect x="0" y="0" width="190" height="150" rx="18" fill="#0f1526" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="95" y="74" text-anchor="middle" fill="url(#acc)" font-size="40">2,000+</text>
      <text x="95" y="104" text-anchor="middle" fill="#e6e9f2" font-size="14" font-weight="700">daily users</text>
      <text x="95" y="124" text-anchor="middle" fill="#8b93a7" font-size="12" font-weight="500">university systems</text>
    </g>
    <g transform="translate(808 0)">
      <rect x="0" y="0" width="190" height="150" rx="18" fill="#0f1526" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="95" y="74" text-anchor="middle" fill="url(#acc)" font-size="46">24/7</text>
      <text x="95" y="104" text-anchor="middle" fill="#e6e9f2" font-size="14" font-weight="700">monitoring</text>
      <text x="95" y="124" text-anchor="middle" fill="#8b93a7" font-size="12" font-weight="500">services, backups and alerts</text>
    </g>
    <g transform="translate(1010 0)">
      <rect x="0" y="0" width="190" height="150" rx="18" fill="#0f1526" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="95" y="74" text-anchor="middle" fill="url(#acc)" font-size="46">4</text>
      <text x="95" y="104" text-anchor="middle" fill="#e6e9f2" font-size="14" font-weight="700">CCNA modules</text>
      <text x="95" y="124" text-anchor="middle" fill="#8b93a7" font-size="12" font-weight="500">Cisco NetAcad + PCAP</text>
    </g>
